[pytest]
# 三个模块的测试一起跑。显式列出而不是靠自动发现，有两个理由：
#
# 1. 仓库根还有一个 Django 脚手架（manage.py + intelligent_home_robot/settings.py）。
#    不限定目录的话，pytest 会把它当成待收集的东西扫一遍 —— 目前恰好无害，
#    但那是运气，不是设计。
# 2. 这三个目录是**唯一**的测试来源，写出来本身就是一句文档：
#    想跑全部测试，在仓库根敲 `pytest` 就够了。
#
# 三个模块各有一条 pytest 命令也能跑（见各自 README）：
#     pytest backend_A/tests
#     pytest backend_B/tests      # 只依赖标准库，任何机器上都能跑
#     pytest frontend_C/tests     # 需要 PyQt5
testpaths =
    backend_A/tests
    backend_B/tests
    frontend_C/tests

# 三个模块的测试都是 unittest 风格（TestCase + self.assertXxx），
# 类名以 Test 开头、函数以 test_ 开头。这两行与 pytest 默认值一致，
# 写出来只是把约定摆明，避免以后有人加了别的命名风格却收集不到。
python_classes = Test*
python_functions = test_*